services:
  hummingbot:
    container_name: hummingbot
    image: 139.99.149.14:5000/fluxlayer/hummingbot
    build:  # Uncomment this and comment image if you want to build it locally
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./conf/connectors:/home/hummingbot/conf/connectors
      - ./conf/strategies:/home/hummingbot/conf/strategies
      - ./conf/controllers:/home/hummingbot/conf/controllers
      - ./conf/scripts:/home/hummingbot/conf/scripts
      - ./logs:/home/hummingbot/logs
      - ./data:/home/hummingbot/data
      - ./certs:/home/hummingbot/certs
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    tty: true
    stdin_open: true
    networks:
      - fluxlayer_net
    environment:
      - RFQ_SERVER_HOST=http://rfq_server:15889
      - BEST_RFQ_SERVER_HOST=http://best_rfq_server:15886
      - MPC_API_HOST=http://fluxlayer_mpc:15887
#      - CONFIG_PASSWORD=a
#      - CONFIG_FILE_NAME=v2_with_controllers.py
#      - SCRIPT_CONFIG=conf_v2_with_controllers.yml

  gateway:
    restart: always
    container_name: gateway
    image: 139.99.149.14:5000/fluxlayer/gateway:development
    ports:
      - "15888:15888"
      - "8080:8080"
    volumes:
      - "./gateway_files/conf:/home/gateway/conf"
      - "./gateway_files/logs:/home/gateway/logs"
      - "./gateway_files/db:/home/gateway/db"
      - "./certs:/home/gateway/certs"
    environment:
      - GATEWAY_PASSPHRASE=a
    networks:
      - fluxlayer_net

  rfq_server:
    restart: always
    container_name: rfq_server
    image: 139.99.149.14:5000/fluxlayer/rfq:latest
    ports:
      - "15889:15889"
    environment:
      - RFQ_SERVER_HOST=http://gateway:15885
      - BEST_RFQ_SERVER_HOST=http://best_rfq_server:15886
      - MPC_API_HOST=http://fluxlayer_mpc:15887
      - PG_HOST=local_postgres
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DATABASE=postgres
      - PG_PORT=5432
    networks:
      - fluxlayer_net

  best_rfq_server:
    restart: always
    container_name: best_rfq_server
    image: 139.99.149.14:5000/fluxlayer/best_rfq:latest
    ports:
      - "15886:15886"
    volumes:
      - "./certs:/home/hummingbot/certs"
    environment:
      - RFQ_SERVER_HOST=http://gateway:15885
      - BEST_RFQ_SERVER_HOST=http://best_rfq_server:15886
      - MPC_API_HOST=http://fluxlayer_mpc:15887
    networks:
      - fluxlayer_net

  fluxlayer_mpc:
    restart: always
    container_name: fluxlayer_mpc
    image: 139.99.149.14:5000/fluxlayer/mpc
    ports:
      - "15887:15887"
    environment:
      - DB_DSN=postgresql://postgres:postgres@local_postgres:5432/postgres
    volumes:
      - ./api.yaml:/api/config-files/api.yaml
    networks:
      - fluxlayer_net

  postgres:
    image: postgres:latest
    container_name: local_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fluxlayer_net

volumes:
  postgres_data:
networks:
  fluxlayer_net: